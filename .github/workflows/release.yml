name: Build & Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Bundle JS (platform-independent, built once on Ubuntu) ──
  bundle:
    name: Bundle JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Bundle pug-cli
        run: npm run bundle

      - name: Stage JS bundles
        run: |
          mkdir -p staging
          cp dist/pug-cli-bundled.js staging/

      - uses: actions/upload-artifact@v7
        with:
          name: js-bundles
          path: staging/*

  # ── Job 2: Build SEA binaries (matrix: win / linux / mac) ──
  build-sea:
    name: Build SEA (${{ matrix.platform }})
    needs: bundle
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: ''
          - os: windows-latest
            platform: win
            arch: x64
            ext: .exe
          - os: macos-latest
            platform: darwin
            arch: arm64
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: js-bundles
          path: dist/

      - name: Build pug-cli SEA binary
        run: npm run sea

      - name: Rename SEA binary
        shell: bash
        run: |
          mv dist/pug${{ matrix.ext }} dist/pug-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}

      - name: Stage SEA binary
        shell: bash
        run: |
          mkdir -p staging
          cp dist/pug-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }} staging/

      - uses: actions/upload-artifact@v7
        with:
          name: sea-binaries-${{ matrix.platform }}
          path: staging/*

  # ── Job 3: Create GitHub Release ──
  release:
    name: Create Release
    needs: build-sea
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/download-artifact@v8
        with:
          pattern: sea-binaries-*
          merge-multiple: true
          path: release-assets/

      - uses: actions/download-artifact@v8
        with:
          name: js-bundles
          path: release-assets/

      - name: Organize assets into groups
        shell: bash
        run: |
          cd release-assets

          # JS Bundle
          mkdir -p "JS Bundle"
          mv pug-cli-bundled.js "JS Bundle/" 2>/dev/null || true

          # pug-cli binaries
          mkdir -p pug-cli
          for f in \
            pug-linux-x64 \
            pug-win-x64.exe \
            pug-darwin-arm64; do
            [ -f "$f" ] && mv "$f" pug-cli/
          done

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-assets

          # Compute SHA256 for all distributable files
          for dir in "JS Bundle" pug-cli; do
            for f in "$dir"/*; do
              [ -f "$f" ] && sha256sum "$f"
            done
          done | sort -k2 > SHA256SUMS

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Create release with auto-generated notes (skip if already exists)
          gh release create "$TAG" --generate-notes 2>/dev/null || \
            echo "Release already exists, skipping creation"

          # Upload all assets preserving directory structure as grouping
          cd release-assets
          find . -type f | while read -r f; do
            name="${f#./}"
            echo "Uploading: $name"
            gh release upload "$TAG" "$f#$name" --clobber
          done
